esphome:
  name: tempdisp
  comment: Esp8266 temperature

esp8266:
  board: esp01_1m

logger:
  baud_rate: 0
#  level: ERROR


api:
  encryption:
    key: !secret key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
#  min_auth_mode: WPA2
  on_connect:
    - logger.log:
        format: "Successfully connected! IP Address: %s"
        args: [ 'WiFi.localIP().toString().c_str()' ]

  ap:
    ssid: temp_ap
    password: 012345678

web_server:
  port: 80

mqtt:
  broker: !secret mqttserver


ota:
  - platform:  esphome

#interval:
#   - interval: 10s
#     then:
#        - lambda: |-
#            ESP_LOGI("info","alive");

one_wire:
  - platform: gpio
    pin: GPIO01  #TXD
#    pin: GPIO03  #RXD


i2c:
   sda: GPIO02
   scl: GPIO00

font:
#  - file: "fonts/Monas-BLBW8.ttf"
#    id: myfont
#    size: 20
#    bpp: 2
#    glyphs: [
#    0123456789C.:°,
#    " ",
#    
#    ]
  - file: "gfonts://Roboto"
    id: font_small
    size: 12

  - file: "gfonts://Silkscreen"
    id: font_medium
    size: 15

  - file: "gfonts://Roboto@700"
    id: font_large
    size: 30
    glyphs: [ 0123456789C.:°," " ]

time:
  - platform: homeassistant
    id: s_time

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    contrast: 0.1
    id: my_display
    lambda: |-
      it.rectangle(0, 0, 127, 15);
      it.rectangle(0, 0, 127, 63);
      auto time_now = id(s_time).now();
      it.strftime(0, 60, id(font_large), TextAlign::BASELINE_LEFT, "%H:%M", id(s_time).now());
      it.image(64, 23, id(temp_icon));
      it.image(64, 44, id(temp_icon));
      if (id(my_temperature_sensor).has_state()) {
        it.printf(127, 23, id(font_medium), TextAlign::TOP_RIGHT , "%.1f", id(my_temperature_sensor).state);
      }
      if (id(weather_temp).has_state()) {
        it.printf(127, 44, id(font_medium), TextAlign::TOP_RIGHT , "%.1f", id(weather_temp).state);
      }




#      it.printf(1,0,id(font_small), "%02d-%02d-%d - %02d:%02d:%02d", time_now.day_of_month, time_now.month, time_now.year, time_now.hour, time_now.minute, time_now.second);
#      if (id(my_temperature_sensor).has_state()) {
#        it.printf(64, 64, id(font_large), TextAlign::BOTTOM_CENTER, "%.1f °C", id(my_temperature_sensor).state);
#      } else {
#        it.print(64, 16, id(font_medium), TextAlign::CENTER, "Loading...");
#      }

sensor:
   - platform: dallas_temp
     name: temperature
     id: my_temperature_sensor
     update_interval: 60s
     on_value:
      then:
        - logger.log:
            format: "The current temperature is: %.1f °C"
            args: [ 'x' ]


   - platform: homeassistant
     entity_id: weather.forecast_maison
     attribute: temperature
     id: weather_temp
     name: "Forecast Temp"
     on_value:
       then:
         - logger.log:
             format: "Forcast temp is: %.1f *C"
             args: ['x']


switch:
  - platform: template
    name: "OLED Display Power"
    id: oled_power_switch
    icon: "mdi:oled"
    optimistic: true
    assumed_state: false
    lambda: |-
      return id(my_display).is_on();
    turn_on_action:
      lambda: |-
        id(my_display).turn_on();
    turn_off_action:
      lambda: |-
        id(my_display).turn_off();


number:
  - platform: template
    name: "OLED Display Contrast"
    id: display_contrast
    icon: "mdi:brightness-6"
    # Define the slider range and steps
    min_value: 0.1
    max_value: 1.0
    step: 0.1
    # Sets the initial slider position in Home Assistant on boot
    initial_value: 0.1
    # Updates the physical display contrast when the slider moves
    set_action:
      then:
        - lambda: |-
            id(my_display).set_contrast(x);


image:
  - file: "mdi:thermometer"
    id: temp_icon
    resize: 16x16 # Adjust according to your screen size
    type: binary
